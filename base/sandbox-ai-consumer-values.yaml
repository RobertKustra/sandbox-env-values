replicaCount: 1

image:
  repository: ghcr.io/robertkustra/dev/sandbox-ai-consumer
  tag: "0.2.1"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-pull-secret

service:
  enabled: false

env:
  config:
    VLLM_BASE_URL: http://sandbox-vllm.llm.svc.cluster.local:8000
    VLLM_MODEL: ziutek_2.0
    VLLM_STRESS: "false"
    VLLM_COUNT: "50"
    VLLM_PARALLEL: "8"
    VLLM_REPEAT_MINUTES: "5"
    VLLM_PROMPT: "Who are you?"
