apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: sandbox-nginx-values-base
    files:
      - values.yaml=common-values.yaml
  - name: sandbox-redis-values-base
    files:
      - values.yaml=sandbox-redis-values.yaml
generatorOptions:
  disableNameSuffixHash: true