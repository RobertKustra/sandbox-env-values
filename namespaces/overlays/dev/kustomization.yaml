apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
      name: environment
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev
      - op: replace
        path: /metadata/labels/environment
        value: dev
      - op: add
        path: /metadata/annotations
        value:
          sandbox.local/description: Development environment
