apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
configMapGenerator:
  - name: sandbox-nginx-values-env
    files:
      - values.yaml=sandbox-nginx.yaml
  - name: sandbox-redis-values-env
    files:
      - values.yaml=sandbox-redis-values.yaml
generatorOptions:
  disableNameSuffixHash: true