image:
  repository: ghcr.io/robertkustra/dev/sandbox-ai-consumer
  tag: "1.0.5" # {"$imagepolicy": "flux-system:sandbox-ai-consumer-dev:tag"}
env:
  config:
    VLLM_STRESS: "false"
    VLLM_COUNT: "100"
    VLLM_PARALLEL: "16"
    VLLM_REPEAT_MINUTES: "1"
    VLLM_PROMPT: "When will you get rid of the people and why?"

resources:
  requests:
    cpu: "50m"
    memory: 128Mi
  limits:
    cpu: "250m"
    memory: 256Mi
