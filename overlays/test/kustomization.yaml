apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test
resources:
  - ../../base
configMapGenerator:
  - name: sandbox-app-values-env
    files:
      - values.yaml=sandbox-app.yaml
  - name: redis-values-env
    files:
      - values.yaml=redis-values.yaml
generatorOptions:
  disableNameSuffixHash: true